<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Два коротких ролика</title>
<style>
  :root { --bg:#f6f6f4; --card:#ffffff; --line:#e2e2de; --text:#1d1d1b; --muted:#6b6b66; --accent:#c4302b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --card:#1f1f1f; --line:#333; --text:#e8e8e6; --muted:#a0a09a; --accent:#ff6b63; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:22px; margin:8px 0 12px; }
  .rules { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:20px; }
  .rules ol { margin:0; padding-left:20px; }
  .rules li { margin:4px 0; }
  .rules b { color:var(--accent); }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px 16px; margin-bottom:20px; }
  h2 { font-size:18px; margin:0 0 10px; }
  .frame { width:100%; margin:0 auto; }
  .frame iframe { display:block; width:100%; height:100%; border:0; border-radius:8px; }
  .vertical { max-width:315px; aspect-ratio:9/16; }
  .horizontal { aspect-ratio:16/9; }
</style>
</head>
<body>
<main>
  <h1>Два коротких ролика — по 30 секунд</h1>
  <div class="rules">
    <ol>
      <li>Нажмите ▶ <b>внутри</b> плеера и досмотрите ролик до конца.</li>
      <li>Каждый ролик — <b>один раз</b>. Повторно не запускайте.</li>
      <li><b>Не нажимайте</b> на название, канал и логотип YouTube или Shorts — это откроет YouTube.</li>
      <li>Обычное окно браузера, не «инкогнито».</li>
    </ol>
  </div>

  <section>
    <h2>Ролик 1</h2>
    <div class="frame vertical"><iframe src="https://www.youtube.com/embed/laN0fuT8K6E" title="test S" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
  </section>

  <section>
    <h2>Ролик 2</h2>
    <div class="frame horizontal"><iframe src="https://www.youtube.com/embed/HqQZv8UK3Pg" title="test H" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
  </section>
</main>
</body>
</html>
